version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "50MB"

  backend1:
    build: ./backend
    environment:
      - BACKEND_PORT=8021
    command: ["/main"]
    expose:
      - "8021"
    networks:
      - backend
      - payment-processor
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"

  backend2:
    build: ./backend
    environment:
      - BACKEND_PORT=8022
    command: ["/main"]
    expose:
      - "8022"
    networks:
      - backend
      - payment-processor
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    networks:
      - backend
      - payment-processor
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "200MB"
    command: [
      "postgres",
      "-c", "shared_buffers=64MB",
      "-c", "work_mem=4MB",
      "-c", "maintenance_work_mem=16MB",
      "-c", "max_connections=500",
      "-c", "synchronous_commit=off",
      "-c", "fsync=off",
      "-c", "full_page_writes=off",
      "-c", "wal_buffers=4MB"
    ]

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
