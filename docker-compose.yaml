version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "30MB"

  backend1:
    build: ./backend
    environment:
      - BACKEND_PORT=8021
    command: ["/main"]
    expose:
      - "8021"
    networks:
      - backend
      - payment-processor
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "30MB"

  backend2:
    build: ./backend
    environment:
      - BACKEND_PORT=8022
    command: ["/main"]
    expose:
      - "8022"
    networks:
      - backend
      - payment-processor
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "30MB"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
      - payment-processor
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "260MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
